function suggestCorrectiveAction(item){
  return CORRECTIVE_ACTIONS_LIB[item.trim()] || `Organiser un point de coaching individuel ciblé sur l'item "${item.trim()}", avec réécoute/relecture d'un cas concret et mise en pratique.`;
}
function addDaysISO(dateStr, days){
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

/* ============================================================
   VUE : ANALYSE (par indicateur)
   ============================================================ */
function AnalyseView({ ecarts, roster, allEvaluations, nccResponses, criteresEcarts, itemsStats }){
  // NCC a désormais son propre bloc d'analyse (causes déduites du verbatim) — il ne rejoint plus
  // le rendu générique "décomposition par item" des indicateurs de conformité/Hubicus.
  const isItemKpi = (k) => k === "Hubicus Voix" || k === "Hubicus Mail" || k === "Conformité Process (Auchan)" || k === "Taux de conformité des transferts en file d'attente" || k === "Conformité Tickets Experts" || k === "Conformité du Panier" || k === "Conformité Appels Raccrochés" || k === "Conformité Transfert des Appels";

  const [kpiFilter, setKpiFilter] = useState(INDICATEURS[0]);
  const isNcc = kpiFilter.includes("NCC");

  // Filtre de période complet (Jour / Semaine / Mois / Plage de dates), comme dans les autres vues.
  const dayOptionsAn = useMemo(() => {
    const set = new Set();
    [ecarts, allEvaluations, criteresEcarts, nccResponses].forEach((arr) => (arr||[]).forEach((e) => { if (e.date) set.add(e.date); }));
    return [...set].sort();
  }, [ecarts, allEvaluations, criteresEcarts, nccResponses]);
  const weekOptionsAn = useMemo(() => {
    const set = new Set();
    [ecarts, allEvaluations, criteresEcarts].forEach((arr) => (arr||[]).forEach((e) => { const c = extractWeekCode(e.semaine); if (c) set.add(c); }));
    return [...set].sort((a,b) => extractWeekNum(a) - extractWeekNum(b));
  }, [ecarts, allEvaluations, criteresEcarts]);
  const monthOptionsAn = useMemo(() => {
    const set = new Set();
    [ecarts, allEvaluations, criteresEcarts, nccResponses].forEach((arr) => (arr||[]).forEach((e) => { const k = monthKeyFromDate(e.date); if (k) set.add(k); }));
    return [...set].sort();
  }, [ecarts, allEvaluations, criteresEcarts, nccResponses]);
  const defaultMonthKey = useMemo(() => {
    const juillet = monthOptionsAn.find((k) => k.endsWith("-07"));
    return juillet || monthOptionsAn[monthOptionsAn.length-1] || "";
  }, [monthOptionsAn]);

  const [granPeriode, setGranPeriode] = useState("mois");
  const [periodeValue, setPeriodeValue] = useState([]);
  const [dateRangePeriode, setDateRangePeriode] = useState({ start:"", end:"" });
  useEffect(() => { if (granPeriode === "mois" && periodeValue.length === 0 && defaultMonthKey) setPeriodeValue([defaultMonthKey]); }, [defaultMonthKey]);

  function inPeriodAn(dateStr, semaineStr){
    if (granPeriode === "plage") return dateInRange(dateStr, dateRangePeriode);
    if (granPeriode === "tous" || periodeValue.length === 0) return true;
    if (granPeriode === "jour") return periodeValue.includes(dateStr);
    if (granPeriode === "semaine") return periodeValue.includes(extractWeekCode(semaineStr));
    if (granPeriode === "mois") return periodeValue.includes(monthKeyFromDate(dateStr));
    return true;
  }
  function periodeLabel(){
    if (granPeriode === "tous" || (granPeriode !== "plage" && periodeValue.length === 0)) return "toutes périodes";
    if (granPeriode === "mois") return periodeValue.map(monthLabelFromKey).join(", ");
    if (granPeriode === "plage") return `du ${dateRangePeriode.start || "…"} au ${dateRangePeriode.end || "…"}`;
    return periodeValue.join(", ");
  }

  // Filtres Manager (multi) + Ancienneté (Nouveau/Ancien), appliqués à l'ensemble des blocs de cette vue.
  const managerOptions = useMemo(() => {
    const set = new Set((roster || []).map((r) => r.manager).filter((m) => m && m !== "RAS"));
    return [...set].sort();
  }, [roster]);
  const [fManager, setFManager] = useState([]);
  const [fAnciennete, setFAnciennete] = useState("Tous");
  function passesFilters(rawOrDisplayConseiller){
    const entry = findRosterEntry(rawOrDisplayConseiller, roster);
    if (fManager.length > 0 && (!entry || !fManager.includes(entry.manager))) return false;
    if (fAnciennete !== "Tous" && (!entry || entry.statut !== fAnciennete)) return false;
    return true;
  }

  const ecartsForMonth = useMemo(
    () => ecarts.filter((e) => inPeriodAn(e.date, e.semaine) && passesFilters(e.conseiller)),
    [ecarts, granPeriode, periodeValue, dateRangePeriode, fManager, fAnciennete, roster]
  );
  const evalsForMonth = useMemo(
    () => (allEvaluations||[]).filter((ev) => inPeriodAn(ev.date, ev.semaine) && passesFilters(ev.conseiller)),
    [allEvaluations, granPeriode, periodeValue, dateRangePeriode, fManager, fAnciennete, roster]
  );
  const nccForMonth = useMemo(
    () => (nccResponses||[]).filter((r) => inPeriodAn(r.date, r.semaine || null) && passesFilters(r.conseillerFull || r.conseiller)),
    [nccResponses, granPeriode, periodeValue, dateRangePeriode, fManager, fAnciennete, roster]
  );
  const criteresForMonth = useMemo(
    () => (criteresEcarts||[]).filter((c) => c.indicateur === kpiFilter && inPeriodAn(c.date, c.semaine) && passesFilters(c.conseiller)),
    [criteresEcarts, kpiFilter, granPeriode, periodeValue, dateRangePeriode, fManager, fAnciennete, roster]
  );
  // Mois calendaires (clé ISO "AAAA-MM") réellement couverts par la sélection en cours — sert à agréger
  // itemsStats (précalculé par mois) quel que soit le type de filtre de période choisi.
  const monthKeysInScope = useMemo(() => {
    const set = new Set();
    [ecartsForMonth, evalsForMonth, criteresForMonth].forEach((arr) => arr.forEach((e) => { const k = monthKeyFromDate(e.date); if (k) set.add(k); }));
    return [...set];
  }, [ecartsForMonth, evalsForMonth, criteresForMonth]);

  const realise = useMemo(() => computeGlobalKpiRealise(ecartsForMonth, evalsForMonth, kpiFilter), [ecartsForMonth, evalsForMonth, kpiFilter]);
  const objectif = OBJECTIFS[kpiFilter];
  const enEcart = realise !== null && realise < objectif;

  const conseillerBreakdown = useMemo(
    () => computeConseillerScoreBreakdown(ecartsForMonth, roster, kpiFilter, allEvaluations, (ev) => inPeriodAn(ev.date, ev.semaine))
      .filter((c) => passesFilters(c.conseiller)),
    [ecartsForMonth, roster, kpiFilter, allEvaluations, granPeriode, periodeValue, dateRangePeriode, fManager, fAnciennete]
  );
  const ccsEnEcart = useMemo(() => conseillerBreakdown
    .filter((c) => c.hasRawData ? (c.avgScore !== null && c.avgScore < objectif) : c.total > 0)
    .sort((a,b) => (a.avgScore ?? 999) - (b.avgScore ?? 999)), [conseillerBreakdown, objectif]);

  // Décomposition par item de grille qualité — pour Hubicus Voix/Mail et les trois indicateurs de
  // conformité (Transfert, Process Auchan, Process Interne) : résultat par item vs objectif, remarques
  // les plus fréquentes (texte réel de l'évaluateur, pas de reformulation) et liste des ccs concernés.
  const isConformiteKpi = (k) => k === "Conformité Process (Auchan)" || k === "Taux de conformité des transferts en file d'attente" || k === "Conformité Tickets Experts" || k === "Conformité du Panier" || k === "Conformité Appels Raccrochés" || k === "Conformité Transfert des Appels";
  const itemsBreakdown = useMemo(() => {
    if (!isItemKpi(kpiFilter)) return [];
    const byItem = {};
    criteresForMonth.forEach((c) => {
      if (!byItem[c.item]) byItem[c.item] = { item: c.item, count: 0, remarques: {}, ccs: {} };
      const b = byItem[c.item];
      b.count += 1;
      b.remarques[c.remarque] = (b.remarques[c.remarque] || 0) + 1;
      const cName = displayConseillerName(c.conseiller);
      if (!b.ccs[cName]) b.ccs[cName] = { conseiller: cName, manager: getConseillerManagerFromRoster(c.conseiller, roster) || "Non trouvé", count: 0 };
      b.ccs[cName].count += 1;
    });
    return Object.values(byItem).map((b) => ({
      item: b.item, count: b.count,
      remarques: Object.entries(b.remarques).sort((a,b2) => b2[1]-a[1]).slice(0,5).map(([texte, n]) => ({ texte, n })),
      ccs: Object.values(b.ccs).sort((a,b2) => b2.count - a.count),
    })).sort((a,b) => b.count - a.count);
  }, [criteresForMonth, kpiFilter, roster]);

  // NCC : la cause n'est plus le simple motif brut — chaque verbatim est analysé (mots-clés) pour en
  // déduire une cause d'insatisfaction exploitable, avec la liste des conseillers concernés par cause.
  const causesNcc = useMemo(() => {
    if (!isNcc) return [];
    const bad = nccForMonth.filter((r) => (r.scoreNCC !== null && r.scoreNCC <= 7) || (r.scoreNPS !== null && r.scoreNPS <= 7));
    const byCause = {};
    bad.forEach((r) => {
      const cause = classifyVerbatimCause(r.verbatim, r.motif);
      if (!byCause[cause]) byCause[cause] = { cause, count: 0, exemples: [], ccs: {} };
      const b = byCause[cause];
      b.count += 1;
      if (b.exemples.length < 3 && r.verbatim) b.exemples.push({ conseiller: r.conseiller, verbatim: r.verbatim, ndemande: r.ndemande || null });
      const cName = r.conseiller || displayConseillerName(r.conseillerFull || "");
      if (!b.ccs[cName]) b.ccs[cName] = { conseiller: cName, manager: getConseillerManagerFromRoster(r.conseillerFull || cName, roster) || "Non trouvé", count: 0 };
      b.ccs[cName].count += 1;
    });
    return Object.values(byCause).map((b) => ({
      ...b, ccs: Object.values(b.ccs).sort((a,b2) => b2.count - a.count),
    })).sort((a,b) => b.count - a.count);
  }, [isNcc, nccForMonth, roster]);

  const remarquesEvaluateur = useMemo(() => {
    if (isNcc || isItemKpi(kpiFilter)) return [];
    return ecartsForMonth
      .filter((e) => e.indicateur === kpiFilter && e.constat)
      .sort((a,b) => (b.date || "").localeCompare(a.date || ""))
      .slice(0, 100);
  }, [ecartsForMonth, kpiFilter, isNcc]);

  return (
    <div>
      <SectionTitle icon="🔍">Analyse par indicateur</SectionTitle>

      <div className="filters" style={{marginBottom:16}}>
        <span style={{fontSize:12, color:"var(--textMuted)", fontWeight:600}}>Indicateur :</span>
        <select value={kpiFilter} onChange={(e) => setKpiFilter(e.target.value)}>
          {INDICATEURS.map((k) => <option key={k}>{k}</option>)}
        </select>
        <MultiSelectDropdown label="Manager :" options={managerOptions} selected={fManager} setSelected={setFManager} />
        <span style={{fontSize:12, color:"var(--textMuted)", fontWeight:600, marginLeft:8}}>Ancienneté :</span>
        <select value={fAnciennete} onChange={(e) => setFAnciennete(e.target.value)}>
          {["Tous","Nouveau","Ancien"].map((s) => <option key={s}>{s}</option>)}
        </select>
      </div>

      <PeriodFilter
        granularity={granPeriode} setGranularity={setGranPeriode}
        value={periodeValue} setValue={setPeriodeValue}
        weekOptions={weekOptionsAn} monthOptions={monthOptionsAn} dayOptions={dayOptionsAn}
        allowRange={true} dateRange={dateRangePeriode} setDateRange={setDateRangePeriode}
      />

      <div className="stat-row" style={{display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:16, marginBottom:20}}>
        <StatCard label="Réalisé" value={formatKpiValue(kpiFilter, realise)} tone={enEcart ? "bad" : "good"} />
        <StatCard label="Objectif" value={formatKpiValue(kpiFilter, objectif)} tone="neutral" />
        <StatCard label="Conseillers en écart" value={ccsEnEcart.length} tone={ccsEnEcart.length>0 ? "bad" : "good"} sub={`sur ${conseillerBreakdown.length} suivis`} />
      </div>

      {isItemKpi(kpiFilter) && !isConformiteKpi(kpiFilter) ? (
        // Hubicus Voix / Hubicus Mail : on reste sur l'ancien format — un seul bloc combinant
        // item + résultat vs objectif + remarques les plus fréquentes + conseillers concernés.
        <div className="card" style={{marginBottom:20}}>
          <div style={{fontSize:13, fontWeight:600, color:"var(--purpleDark)", marginBottom:12}}>
            Causes de non-performance par item ({periodeLabel()})
          </div>
          {itemsBreakdown.length === 0 ? <p style={{fontSize:13, color:"var(--textMuted)"}}>Aucun écart par item sur cette période.</p> : (
            <div style={{display:"flex", flexDirection:"column", gap:16}}>
              {itemsBreakdown.map((it) => {
                const res = getItemResultForPeriod(itemsStats, kpiFilter, it.item, monthKeysInScope);
                return (
                <div key={it.item} style={{borderLeft:"3px solid var(--red)", paddingLeft:12}}>
                  <div style={{fontWeight:600, fontSize:13, marginBottom:4, display:"flex", alignItems:"center", gap:10}}>
                    <span>{it.item} — {it.count} écart(s)</span>
                    {res && res.taux !== null && (
                      <span className="badge" style={{background: res.taux < OBJECTIFS[kpiFilter] ? "var(--redSoft)" : "var(--greenSoft, #E3F5EC)", color: res.taux < OBJECTIFS[kpiFilter] ? "var(--red)" : "var(--green)"}}>
                        Résultat : {res.taux}% ({res.ok}/{res.total}) — objectif {OBJECTIFS[kpiFilter]}%
                      </span>
                    )}
                  </div>
                  <div style={{fontSize:12, color:"var(--textMuted)", marginBottom:6}}>
                    {it.remarques.map((r) => `${r.texte} (${r.n})`).join(" · ")}
                  </div>
                  <details>
                    <summary style={{fontSize:12, color:"var(--purple)", cursor:"pointer"}}>Conseillers en écart sur cet item ({it.ccs.length})</summary>
                    <div style={{marginTop:6, display:"flex", flexWrap:"wrap", gap:6}}>
                      {it.ccs.map((c) => (
                        <span key={c.conseiller} className="badge" style={{background:"var(--redSoft)", color:"var(--red)"}}>
                          {c.conseiller} ({c.manager}) — {c.count}
                        </span>
                      ))}
                    </div>
                  </details>
                </div>
                );
              })}
            </div>
          )}
        </div>
      ) : isItemKpi(kpiFilter) ? (
        // Conformité Process (Auchan/Interne) et Taux de conformité des transferts en file d'attente : deux blocs séparés — le résultat
        // par item vs objectif d'une part, les remarques réelles de l'évaluateur d'autre part (mêmes
        // données qu'avant, simplement présentées dans deux cartes distinctes plutôt qu'une reformulation).
        <>
        <div className="card" style={{marginBottom:20}}>
          <div style={{fontSize:13, fontWeight:600, color:"var(--purpleDark)", marginBottom:12}}>
            Résultats par item vs objectif ({periodeLabel()})
          </div>
          {itemsBreakdown.length === 0 ? <p style={{fontSize:13, color:"var(--textMuted)"}}>Aucun écart par item sur cette période.</p> : (
            <div style={{display:"flex", flexDirection:"column", gap:16}}>
              {itemsBreakdown.map((it) => {
                const res = getItemResultForPeriod(itemsStats, kpiFilter, it.item, monthKeysInScope);
                return (
                <div key={it.item} style={{borderLeft:"3px solid var(--red)", paddingLeft:12}}>
                  <div style={{fontWeight:600, fontSize:13, marginBottom:4, display:"flex", alignItems:"center", gap:10}}>
                    <span>{it.item} — {it.count} écart(s)</span>
                    {res && res.taux !== null && (
                      <span className="badge" style={{background: res.taux < OBJECTIFS[kpiFilter] ? "var(--redSoft)" : "var(--greenSoft, #E3F5EC)", color: res.taux < OBJECTIFS[kpiFilter] ? "var(--red)" : "var(--green)"}}>
                        Résultat : {res.taux}% ({res.ok}/{res.total}) — objectif {OBJECTIFS[kpiFilter]}%
                      </span>
                    )}
                  </div>
                  <details>
                    <summary style={{fontSize:12, color:"var(--purple)", cursor:"pointer"}}>Conseillers en écart sur cet item ({it.ccs.length})</summary>
                    <div style={{marginTop:6, display:"flex", flexWrap:"wrap", gap:6}}>
                      {it.ccs.map((c) => (
                        <span key={c.conseiller} className="badge" style={{background:"var(--redSoft)", color:"var(--red)"}}>
                          {c.conseiller} ({c.manager}) — {c.count}
                        </span>
                      ))}
                    </div>
                  </details>
                </div>
                );
              })}
            </div>
          )}
        </div>

        <div className="card" style={{marginBottom:20}}>
          <div style={{fontSize:13, fontWeight:600, color:"var(--purpleDark)", marginBottom:12}}>
            Remarques des évaluateurs par item ({periodeLabel()})
          </div>
          {itemsBreakdown.length === 0 ? <p style={{fontSize:13, color:"var(--textMuted)"}}>Aucune remarque sur cette période.</p> : (
            <div style={{display:"flex", flexDirection:"column", gap:12}}>
              {itemsBreakdown.map((it) => (
                <div key={it.item} style={{borderLeft:"3px solid var(--purple)", paddingLeft:12}}>
                  <div style={{fontWeight:600, fontSize:13, marginBottom:4}}>{it.item}</div>
                  <div style={{fontSize:12, color:"var(--textMuted)"}}>
                    {it.remarques.map((r) => `${r.texte} (${r.n})`).join(" · ")}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
        </>
      ) : isNcc ? (
        <div className="card" style={{marginBottom:20}}>
          <div style={{fontSize:13, fontWeight:600, color:"var(--purpleDark)", marginBottom:6}}>
            Causes d'insatisfaction client — analyse du verbatim ({periodeLabel()})
          </div>
          <div className="notice info" style={{marginBottom:12}}>
            <span className="ic">ℹ</span>
            <div>Chaque verbatim est analysé (au-delà du simple motif déclaré) pour en déduire la cause réelle
            d'insatisfaction du client. Les causes non reconnues par l'analyse retombent sur le motif déclaré.</div>
          </div>
          {causesNcc.length === 0 ? <p style={{fontSize:13, color:"var(--textMuted)"}}>Aucune insatisfaction (NCC/NPS ≤ 7) sur cette période.</p> : (
            <>
            <div style={{marginBottom:18}}>
              <div style={{fontSize:12, fontWeight:600, color:"var(--textMuted)", marginBottom:8}}>Poids des causes d'insatisfaction</div>
              {(() => {
                const maxCount = Math.max(...causesNcc.map((c) => c.count));
                return causesNcc.map((c) => (
                  <div key={c.cause} style={{display:"flex", alignItems:"center", gap:8, marginBottom:6}}>
                    <div style={{width:220, fontSize:11, color:"var(--textMuted)", flexShrink:0, textAlign:"right"}}>{c.cause}</div>
                    <div style={{flex:1, background:"var(--grey)", borderRadius:4, overflow:"hidden"}}>
                      <div style={{width:`${(c.count/maxCount)*100}%`, background:"var(--red)", color:"#fff", fontSize:11, padding:"3px 6px", whiteSpace:"nowrap", minWidth:20}}>
                        {c.count}
                      </div>
                    </div>
                  </div>
                ));
              })()}
            </div>
            <div style={{display:"flex", flexDirection:"column", gap:16}}>
              {causesNcc.map((c) => (
                <div key={c.cause} style={{borderLeft:"3px solid var(--red)", paddingLeft:12}}>
                  <div style={{fontWeight:600, fontSize:13, marginBottom:4}}>{c.cause} — {c.count} cas</div>
                  {c.exemples.map((ex, i) => (
                    <div key={i} style={{fontSize:12, color:"var(--textMuted)", marginTop:4}}>
                      « {ex.verbatim} » — {ex.conseiller}{ex.ndemande ? ` (Demande n° ${ex.ndemande})` : ""}
                    </div>
                  ))}
                  <details style={{marginTop:6}}>
                    <summary style={{fontSize:12, color:"var(--purple)", cursor:"pointer"}}>Conseillers concernés par cette cause ({c.ccs.length})</summary>
                    <div style={{marginTop:6, display:"flex", flexWrap:"wrap", gap:6}}>
                      {c.ccs.map((cc) => (
                        <span key={cc.conseiller} className="badge" style={{background:"var(--redSoft)", color:"var(--red)"}}>
                          {cc.conseiller} ({cc.manager}) — {cc.count}
                        </span>
                      ))}
                    </div>
                  </details>
                </div>
              ))}
            </div>
            </>
          )}
        </div>
      ) : (
        <div className="card" style={{marginBottom:20}}>
          <div style={{fontSize:13, fontWeight:600, color:"var(--purpleDark)", marginBottom:12}}>
            Remarques des évaluateurs (constats)
          </div>
          <div className="notice info" style={{marginBottom:12}}>
            <span className="ic">ℹ</span>
            <div>Cet indicateur n'a pas de décomposition par item disponible dans les fichiers source —
            voici la synthèse des constats détaillés saisis par les évaluateurs lors du débriefing, les plus récents en premier.</div>
          </div>
          {remarquesEvaluateur.length === 0 ? <p style={{fontSize:13, color:"var(--textMuted)"}}>Aucun constat disponible pour cet indicateur sur ce mois.</p> : (
            <div style={{overflowX:"auto"}}>
              <table>
                <thead><tr>{["Conseiller","Date","Écart constaté","Constat de l'évaluateur"].map((h) => <th key={h}>{h}</th>)}</tr></thead>
                <tbody>
                  {remarquesEvaluateur.map((e) => (
                    <tr key={e.id}>
                      <td>{e.conseiller}</td>
                      <td style={{whiteSpace:"nowrap"}}>{e.date || "—"}</td>
                      <td style={{fontSize:12}}>{e.ecart}</td>
                      <td style={{fontSize:12}}>{e.constat}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      <div className="card" style={{padding:0, overflow:"hidden"}}>
        <div style={{padding:"12px 14px", fontSize:13, fontWeight:600, color:"var(--purpleDark)", borderBottom:"1px solid var(--greyLine)"}}>
          Conseillers en écart ({ccsEnEcart.length}) — {kpiFilter}
        </div>
        <div style={{overflowX:"auto", maxHeight:420, overflowY:"auto"}}>
          <table>
            <thead><tr>{["Conseiller","Manager","Score","Objectif","Nb éval."].map((h) => <th key={h}>{h}</th>)}</tr></thead>
            <tbody>
              {ccsEnEcart.map((c, i) => (
                <tr key={c.conseiller+i}>
                  <td>{c.conseiller}</td>
                  <td>{c.manager}</td>
                  <td style={{fontWeight:600, color:"var(--red)"}}>{c.avgScore !== null ? `${c.avgScore}${c.unit}` : `${c.total} écart(s)`}</td>
                  <td style={{fontSize:12, color:"var(--textMuted)"}}>{formatKpiValue(kpiFilter, objectif)}</td>
                  <td style={{fontSize:12, color:"var(--textMuted)"}}>{c.hasRawData ? c.nbEval : "—"}</td>
                </tr>
              ))}
              {ccsEnEcart.length === 0 && (
                <tr><td colSpan="5" style={{textAlign:"center", padding:20, color:"var(--textMuted)"}}>Aucun conseiller en écart 🎉</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   VUE : PLAN D'ACTION (par indicateur)
   ============================================================ */
function PlanActionView({ ecarts, roster, allEvaluations, criteresEcarts, itemsStats, planActions, setPlanActions, planActionsArchive, setPlanActionsArchive, auth }){
  const isAdmin = auth.role === "admin";
  const isOwnerOf = (p) => !isAdmin && auth.ownerName && p.owner === auth.ownerName;
  const canEdit = (p) => isAdmin || isOwnerOf(p);
  const [kpiFilter, setKpiFilter] = useState(INDICATEURS[0]);
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const blankForm = { conseillerCible:"Toute l'équipe", itemImpacte:"", constat:"", actionCorrective:"", owner:"", statut:"À lancer", echeance:"" };
  const [form, setForm] = useState(blankForm);
  const [showArchive, setShowArchive] = useState(false);

  const dayOptionsAn = useMemo(() => {
    const set = new Set();
    [ecarts, allEvaluations, criteresEcarts].forEach((arr) => (arr||[]).forEach((e) => { if (e.date) set.add(e.date); }));
    return [...set].sort();
  }, [ecarts, allEvaluations, criteresEcarts]);
  const weekOptionsAn = useMemo(() => {
    const set = new Set();
    [ecarts, allEvaluations, criteresEcarts].forEach((arr) => (arr||[]).forEach((e) => { const c = extractWeekCode(e.semaine); if (c) set.add(c); }));
    return [...set].sort((a,b) => extractWeekNum(a) - extractWeekNum(b));
  }, [ecarts, allEvaluations, criteresEcarts]);
  const monthOptionsAn = useMemo(() => {
    const set = new Set();
    [ecarts, allEvaluations, criteresEcarts].forEach((arr) => (arr||[]).forEach((e) => { const k = monthKeyFromDate(e.date); if (k) set.add(k); }));
    return [...set].sort();
  }, [ecarts, allEvaluations, criteresEcarts]);
  const defaultMonthKey = useMemo(() => {
    const juillet = monthOptionsAn.find((k) => k.endsWith("-07"));
    return juillet || monthOptionsAn[monthOptionsAn.length-1] || "";
  }, [monthOptionsAn]);

  const [granPeriode, setGranPeriode] = useState("mois");
  const [periodeValue, setPeriodeValue] = useState([]);
  const [dateRangePeriode, setDateRangePeriode] = useState({ start:"", end:"" });
  useEffect(() => { if (granPeriode === "mois" && periodeValue.length === 0 && defaultMonthKey) setPeriodeValue([defaultMonthKey]); }, [defaultMonthKey]);

  function inPeriodAn(dateStr, semaineStr){
    if (granPeriode === "plage") return dateInRange(dateStr, dateRangePeriode);
    if (granPeriode === "tous" || periodeValue.length === 0) return true;
    if (granPeriode === "jour") return periodeValue.includes(dateStr);
    if (granPeriode === "semaine") return periodeValue.includes(extractWeekCode(semaineStr));
    if (granPeriode === "mois") return periodeValue.includes(monthKeyFromDate(dateStr));
    return true;
  }
  function periodeLabel(){
    if (granPeriode === "tous" || (granPeriode !== "plage" && periodeValue.length === 0)) return "toutes périodes";
    if (granPeriode === "mois") return periodeValue.map(monthLabelFromKey).join(", ");
    if (granPeriode === "plage") return `du ${dateRangePeriode.start || "…"} au ${dateRangePeriode.end || "…"}`;
    return periodeValue.join(", ");
  }

  // Filtres Manager (multi) + Ancienneté — mêmes filtres que la vue Analyse, appliqués aux conseillers ciblés
  // (les actions "Toute l'équipe" restent toujours visibles car elles ne ciblent personne en particulier).
  const managerOptions = useMemo(() => {
    const set = new Set((roster || []).map((r) => r.manager).filter((m) => m && m !== "RAS"));
    return [...set].sort();
  }, [roster]);
  const [fManager, setFManager] = useState([]);
  const [fAnciennete, setFAnciennete] = useState("Tous");
  function passesFilters(conseillerCible){
    if (!conseillerCible || conseillerCible === "Toute l'équipe") return true;
    const entry = findRosterEntry(conseillerCible, roster);
    if (fManager.length > 0 && (!entry || !fManager.includes(entry.manager))) return false;
    if (fAnciennete !== "Tous" && (!entry || entry.statut !== fAnciennete)) return false;
    return true;
  }

  const isItemKpi = kpiFilter === "Hubicus Voix" || kpiFilter === "Hubicus Mail" || kpiFilter === "Conformité Process (Auchan)" || kpiFilter === "Taux de conformité des transferts en file d'attente" || kpiFilter === "Conformité Tickets Experts" || kpiFilter === "Conformité du Panier" || kpiFilter === "Conformité Appels Raccrochés" || kpiFilter === "Conformité Transfert des Appels" || kpiFilter.includes("NCC");
  const ecartsForMonth = useMemo(() => ecarts.filter((e) => inPeriodAn(e.date, e.semaine)), [ecarts, granPeriode, periodeValue, dateRangePeriode]);
  const evalsForMonth = useMemo(() => (allEvaluations||[]).filter((ev) => inPeriodAn(ev.date, ev.semaine)), [allEvaluations, granPeriode, periodeValue, dateRangePeriode]);
  const monthKeysInScope = useMemo(() => {
    const set = new Set();
    [ecartsForMonth, evalsForMonth].forEach((arr) => arr.forEach((e) => { const k = monthKeyFromDate(e.date); if (k) set.add(k); }));
    return [...set];
  }, [ecartsForMonth, evalsForMonth]);

  const realise = useMemo(() => computeGlobalKpiRealise(ecartsForMonth, evalsForMonth, kpiFilter), [ecartsForMonth, evalsForMonth, kpiFilter]);
  const objectif = OBJECTIFS[kpiFilter];

  const rosterNames = useMemo(() => [...new Set(roster.map((r) => displayConseillerName(r.conseiller)))].sort(), [roster]);

  const filtered = useMemo(() => planActions.filter((p) => p.indicateur === kpiFilter && passesFilters(p.conseillerCible))
    .sort((a,b) => (a.echeance || "").localeCompare(b.echeance || "")), [planActions, kpiFilter, fManager, fAnciennete, roster]);

  const archiveForKpi = useMemo(
    () => (planActionsArchive || []).filter((a) => a.indicateur === kpiFilter).sort((a,b) => (b.validatedAt||"").localeCompare(a.validatedAt||"")),
    [planActionsArchive, kpiFilter]
  );

  function openNewForm(){
    setForm(blankForm); setEditingId(null); setShowForm(true);
  }
  function openEditForm(p){
    setForm({ conseillerCible:p.conseillerCible, itemImpacte:p.itemImpacte, constat:p.constat, actionCorrective:p.actionCorrective, owner:p.owner, statut:p.statut, echeance:p.echeance });
    setEditingId(p.id); setShowForm(true);
  }
  function saveForm(){
    if (editingId) {
      setPlanActions(planActions.map((p) => p.id === editingId ? { ...p, ...form } : p));
    } else {
      setPlanActions([...planActions, { id: uid(), indicateur: kpiFilter, ...form, dateCreation: new Date().toISOString().slice(0,10) }]);
    }
    setShowForm(false); setEditingId(null);
  }
  function deleteAction(id){
    if (window.confirm("Supprimer définitivement cette action ?")) setPlanActions(planActions.filter((p) => p.id !== id));
  }
  function updateStatut(id, statut){
    setPlanActions(planActions.map((p) => p.id === id ? { ...p, statut } : p));
  }
  function updateOwner(id, owner){
    setPlanActions(planActions.map((p) => p.id === id ? { ...p, owner } : p));
  }

  /* Archive un instantané (snapshot) du plan d'action actuellement affiché (indicateur + mois + filtres
     en cours) — conservé indéfiniment dans le stockage partagé (Firestore), visible par tous les
     utilisateurs, avec la date et l'auteur de la validation. N'efface ni ne verrouille le plan actif :
     c'est un point de contrôle pour l'historique/traçabilité, pas une suppression. */
  function validerPlan(){
    if (filtered.length === 0) { alert("Aucune action à valider pour ces filtres."); return; }
    const snapshot = {
      id: uid(),
      indicateur: kpiFilter,
      periodeLabel: periodeLabel(),
      validatedAt: new Date().toISOString(),
      validatedBy: auth.label || auth.username || "Inconnu",
      actions: filtered.map((p) => ({ ...p })),
    };
    setPlanActionsArchive([...(planActionsArchive||[]), snapshot]);
    alert(`Plan d'action validé et archivé (${filtered.length} action(s)) — ${periodeLabel()}.`);
  }

  /* Réintègre les actions d'un plan archivé dans le plan actif, pour reprise/modification —
     les actions dont l'id existe déjà sont mises à jour, les autres sont recréées. */
  function reprendrePlan(snapshot){
    if (!window.confirm(`Reprendre le plan validé le ${new Date(snapshot.validatedAt).toLocaleString("fr-FR")} par ${snapshot.validatedBy} ? Ses actions seront réintégrées dans le plan actif (modifiable).`)) return;
    const byId = new Map(planActions.map((p) => [p.id, p]));
    snapshot.actions.forEach((a) => byId.set(a.id, { ...a }));
    setPlanActions([...byId.values()]);
    setKpiFilter(snapshot.indicateur);
    setShowArchive(false);
  }

  /* Supprime définitivement un plan validé de l'historique partagé — n'affecte pas le plan actif. */
  function deleteArchive(id){
    if (window.confirm("Supprimer définitivement ce plan validé de l'historique ? Cette action est irréversible et s'applique pour tous les utilisateurs.")) {
      setPlanActionsArchive((planActionsArchive||[]).filter((a) => a.id !== id));
    }
  }

  /* Génère automatiquement une action par item en écart (sur la période sélectionnée) qui n'a pas déjà
     une action active — reprend la synthèse des remarques les plus fréquentes comme constat, propose
     une action corrective, échéance J+15, statut initial "À lancer". */
  function actualiserPlan(){
    if (!isItemKpi) {
      alert("La génération automatique n'est pas disponible pour cet indicateur (pas de décomposition par item dans les fichiers source).");
      return;
    }
    const relevant = (criteresEcarts||[]).filter((c) => c.indicateur === kpiFilter && inPeriodAn(c.date, c.semaine));
    const byItem = {};
    relevant.forEach((c) => {
      if (!byItem[c.item]) byItem[c.item] = { item: c.item, remarques: {} };
      byItem[c.item].remarques[c.remarque] = (byItem[c.item].remarques[c.remarque] || 0) + 1;
    });
    const items = Object.values(byItem);
    const existingActiveItems = new Set(planActions.filter((p) => p.indicateur === kpiFilter && p.statut !== "Terminée").map((p) => p.itemImpacte));
    const today = new Date().toISOString().slice(0,10);
    const toAdd = [];
    items.forEach((it) => {
      if (existingActiveItems.has(it.item)) return;
      const topRemarques = Object.entries(it.remarques).sort((a,b) => b[1]-a[1]).slice(0,2).map(([t,n]) => `${t} (${n})`).join(", ");
      toAdd.push({
        id: uid(), indicateur: kpiFilter, conseillerCible: "Toute l'équipe",
        itemImpacte: it.item, constat: topRemarques, actionCorrective: suggestCorrectiveAction(it.item),
        owner: "", statut: "À lancer", echeance: addDaysISO(today, 15), dateCreation: today,
      });
    });
    if (toAdd.length === 0) {
      alert("Aucune nouvelle action à créer : tous les items en écart sur ce mois ont déjà une action active, ou aucun écart détecté.");
      return;
    }
    setPlanActions([...planActions, ...toAdd]);
    alert(`${toAdd.length} action(s) créée(s) automatiquement pour ${periodeLabel()}.`);
  }

  return (
    <div>
      <SectionTitle icon="🎯">Plan d'action par indicateur</SectionTitle>

      <div className="filters" style={{marginBottom:16}}>
        <span style={{fontSize:12, color:"var(--textMuted)", fontWeight:600}}>Indicateur :</span>
        <select value={kpiFilter} onChange={(e) => setKpiFilter(e.target.value)}>
          {INDICATEURS.map((k) => <option key={k}>{k}</option>)}
        </select>
        <MultiSelectDropdown label="Manager :" options={managerOptions} selected={fManager} setSelected={setFManager} />
        <span style={{fontSize:12, color:"var(--textMuted)", fontWeight:600, marginLeft:8}}>Ancienneté :</span>
        <select value={fAnciennete} onChange={(e) => setFAnciennete(e.target.value)}>
          {["Tous","Nouveau","Ancien"].map((s) => <option key={s}>{s}</option>)}
        </select>
      </div>

      <PeriodFilter
        granularity={granPeriode} setGranularity={setGranPeriode}
        value={periodeValue} setValue={setPeriodeValue}
        weekOptions={weekOptionsAn} monthOptions={monthOptionsAn} dayOptions={dayOptionsAn}
        allowRange={true} dateRange={dateRangePeriode} setDateRange={setDateRangePeriode}
      />

      <div className="filters" style={{marginBottom:16}}>
        {isAdmin && <button className="btn" onClick={actualiserPlan}>🔄 Actualiser le plan d'action</button>}
        {isAdmin && <button className="btn" style={{color:"var(--purple)", borderColor:"var(--purple)"}} onClick={validerPlan}>🔒 Valider le plan d'action</button>}
        <button className="btn" onClick={() => setShowArchive((s) => !s)}>🗂 Historique des plans validés ({archiveForKpi.length})</button>
        {isAdmin && <button className="btn primary" style={{marginLeft:"auto"}} onClick={openNewForm}>+ Ajouter une action</button>}
      </div>

      {showArchive && (
        <div className="card" style={{marginBottom:20}}>
          <div style={{fontWeight:600, fontSize:14, marginBottom:10}}>Plans validés archivés — {kpiFilter} <span style={{fontSize:11, fontWeight:400, color:"var(--textMuted)"}}>(partagés entre tous les utilisateurs)</span></div>
          {archiveForKpi.length === 0 ? <p style={{fontSize:13, color:"var(--textMuted)"}}>Aucun plan validé pour cet indicateur pour le moment.</p> : (
            <div style={{display:"flex", flexDirection:"column", gap:10}}>
              {archiveForKpi.map((snap) => (
                <details key={snap.id} style={{borderLeft:"3px solid var(--purple)", paddingLeft:12}}>
                  <summary style={{cursor:"pointer", fontSize:13}}>
                    <strong>{snap.periodeLabel || "période non renseignée"}</strong> — validé le {new Date(snap.validatedAt).toLocaleString("fr-FR")} par {snap.validatedBy} — {snap.actions.length} action(s)
                    {isAdmin && (
                      <button className="btn" style={{marginLeft:12, padding:"2px 8px", fontSize:11}} onClick={(e) => { e.preventDefault(); reprendrePlan(snap); }}>↩ Reprendre / Modifier</button>
                    )}
                    {isAdmin && (
                      <button className="btn" style={{marginLeft:6, padding:"2px 8px", fontSize:11, color:"var(--red)"}} onClick={(e) => { e.preventDefault(); deleteArchive(snap.id); }}>🗑 Supprimer</button>
                    )}
                  </summary>
                  <div style={{overflowX:"auto", marginTop:8}}>
                    <table>
                      <thead><tr>{["Conseiller ciblé","Item impacté","Constat","Action corrective","Owner","Statut","Échéance"].map((h) => <th key={h}>{h}</th>)}</tr></thead>
                      <tbody>
                        {snap.actions.map((p) => (
                          <tr key={p.id}>
                            <td style={{fontSize:12}}>{p.conseillerCible}</td>
                            <td style={{fontSize:12}}>{p.itemImpacte || "—"}</td>
                            <td style={{fontSize:12, maxWidth:200}}>{p.constat || "—"}</td>
                            <td style={{fontSize:12, maxWidth:200}}>{p.actionCorrective || "—"}</td>
                            <td style={{fontSize:12}}>{p.owner || "—"}</td>
                            <td style={{fontSize:12}}>{p.statut}</td>
                            <td style={{fontSize:12}}>{p.echeance || "—"}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </details>
              ))}
            </div>
          )}
        </div>
      )}

      <div className="stat-row" style={{display:"grid", gridTemplateColumns:"repeat(3, 1fr)", gap:16, marginBottom:20}}>
        <StatCard label="Réalisé" value={formatKpiValue(kpiFilter, realise)} tone={(realise !== null && realise < objectif) ? "bad" : "good"} />
        <StatCard label="Objectif" value={formatKpiValue(kpiFilter, objectif)} tone="neutral" />
        <StatCard label="Actions en cours" value={filtered.filter((p) => p.statut !== "Terminée").length} tone="neutral" sub={`${filtered.length} au total`} />
      </div>

      {showForm && (
        <div className="card" style={{marginBottom:20, borderLeft:"4px solid var(--purple)"}}>
          <div style={{fontWeight:600, fontSize:14, marginBottom:12}}>{editingId ? "Modifier l'action" : "Nouvelle action"} — {kpiFilter}</div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12}}>
            <div>
              <p className="field-label">Conseiller ciblé</p>
              <select style={{width:"100%"}} value={form.conseillerCible} onChange={(e) => setForm({...form, conseillerCible:e.target.value})}>
                <option>Toute l'équipe</option>
                {rosterNames.map((n) => <option key={n}>{n}</option>)}
              </select>
            </div>
            <div>
              <p className="field-label">Owner</p>
              <select style={{width:"100%"}} value={form.owner} onChange={(e) => setForm({...form, owner:e.target.value})}>
                <option value="">—</option>
                {MANAGERS.map((m) => <option key={m}>{m}</option>)}
              </select>
            </div>
            <div>
              <p className="field-label">Item impacté</p>
              <input style={{width:"100%"}} value={form.itemImpacte} onChange={(e) => setForm({...form, itemImpacte:e.target.value})} placeholder="ex : Accueil téléphonique" />
            </div>
            <div>
              <p className="field-label">Échéance</p>
              <input type="date" style={{width:"100%"}} value={form.echeance} onChange={(e) => setForm({...form, echeance:e.target.value})} />
            </div>
            <div style={{gridColumn:"1 / -1"}}>
              <p className="field-label">Constat</p>
              <textarea style={{width:"100%"}} rows="2" value={form.constat} onChange={(e) => setForm({...form, constat:e.target.value})}></textarea>
            </div>
            <div style={{gridColumn:"1 / -1"}}>
              <p className="field-label">Action corrective</p>
              <textarea style={{width:"100%"}} rows="2" value={form.actionCorrective} onChange={(e) => setForm({...form, actionCorrective:e.target.value})}></textarea>
            </div>
            <div>
              <p className="field-label">Statut</p>
              <select style={{width:"100%"}} value={form.statut} onChange={(e) => setForm({...form, statut:e.target.value})}>
                {["À lancer","En cours","Terminée"].map((s) => <option key={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div style={{marginTop:14, display:"flex", gap:8}}>
            <button className="btn primary" onClick={saveForm}>💾 Enregistrer</button>
            <button className="btn" onClick={() => { setShowForm(false); setEditingId(null); }}>Annuler</button>
          </div>
        </div>
      )}

      <div className="card" style={{padding:0, overflow:"hidden"}}>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead>
              <tr>{["Conseiller ciblé","Item impacté","Résultat actuel (item)","Constat","Action corrective","Owner","Statut","Échéance","Résultat post-coaching",""].map((h) => <th key={h}>{h}</th>)}</tr>
            </thead>
            <tbody>
              {filtered.map((p) => {
                const post = computeResultatPostCoaching(p, allEvaluations);
                const itemResult = getItemResultForPeriod(itemsStats, p.indicateur, p.itemImpacte, monthKeysInScope);
                const enRetard = p.statut !== "Terminée" && p.echeance && p.echeance < new Date().toISOString().slice(0,10);
                const editable = canEdit(p);
                return (
                  <tr key={p.id} style={{backgroundColor: enRetard ? "var(--redSoft)" : undefined}}>
                    <td style={{fontSize:12}}>{p.conseillerCible}</td>
                    <td style={{fontSize:12}}>{p.itemImpacte || "—"}</td>
                    <td style={{fontSize:12, fontWeight:600, color: itemResult && itemResult.taux !== null && itemResult.taux < OBJECTIFS[p.indicateur] ? "var(--red)" : "var(--green)"}}>
                      {itemResult && itemResult.taux !== null ? `${itemResult.taux}% (${itemResult.ok}/${itemResult.total})` : "—"}
                    </td>
                    <td style={{fontSize:12, maxWidth:220}}><span className="truncate" style={{maxWidth:220, display:"inline-block"}}>{p.constat || "—"}</span></td>
                    <td style={{fontSize:12, maxWidth:220}}><span className="truncate" style={{maxWidth:220, display:"inline-block"}}>{p.actionCorrective || "—"}</span></td>
                    <td style={{fontSize:12}}>
                      {isAdmin ? (
                        <select value={p.owner || ""} onChange={(e) => updateOwner(p.id, e.target.value)}>
                          <option value="">—</option>
                          {MANAGERS.map((m) => <option key={m}>{m}</option>)}
                        </select>
                      ) : (p.owner || "—")}
                    </td>
                    <td>
                      <select value={p.statut} onChange={(e) => updateStatut(p.id, e.target.value)}>
                        {["À lancer","En cours","Terminée"].map((s) => <option key={s}>{s}</option>)}
                      </select>
                    </td>
                    <td style={{fontSize:12, whiteSpace:"nowrap", color: enRetard ? "var(--red)" : undefined}}>{p.echeance || "—"}</td>
                    <td style={{fontSize:12, fontWeight:600}}>
                      {post ? `${formatKpiValue(kpiFilter, post.value)} (${post.nb} éval.)` : "En attente de données post-échéance"}
                    </td>
                    <td>
                      <div style={{display:"flex", gap:4}}>
                        {editable && <button className="btn" style={{padding:"2px 6px", fontSize:12}} onClick={() => openEditForm(p)}>✎</button>}
                        {isAdmin && <button className="btn" style={{padding:"2px 6px", fontSize:12, color:"var(--red)"}} onClick={() => deleteAction(p.id)}>🗑</button>}
                      </div>
                    </td>
                  </tr>
                );
              })}
              {filtered.length === 0 && (
                <tr><td colSpan="10" style={{textAlign:"center", padding:20, color:"var(--textMuted)"}}>Aucune action pour cet indicateur.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   VUE : GESTION DES UTILISATEURS (admin uniquement)
   ============================================================ */
function UserManagementView({ users, setUsers, currentUserId }){
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const blank = { username:"", password:"", role:"user", label:"", ownerName:"" };
  const [form, setForm] = useState(blank);
  const [error, setError] = useState("");

  function openNew(){ setForm(blank); setEditingId(null); setError(""); setShowForm(true); }
  function openEdit(u){ setForm({ username:u.username, password:"", role:u.role, label:u.label, ownerName:u.ownerName||"" }); setEditingId(u.id); setError(""); setShowForm(true); }

  function save(){
    const uname = form.username.trim();
    if (!uname) { setError("Identifiant requis."); return; }
    const clash = users.find((u) => u.username.toLowerCase() === uname.toLowerCase() && u.id !== editingId);
    if (clash) { setError("Cet identifiant existe déjà."); return; }
    if (editingId) {
      setUsers(users.map((u) => u.id === editingId
        ? { ...u, username: uname, role: form.role, label: form.label || uname, ownerName: form.ownerName, ...(form.password ? { password: form.password } : {}) }
        : u));
    } else {
      if (!form.password) { setError("Mot de passe requis pour un nouveau compte."); return; }
      setUsers([...users, { id: uid(), username: uname, password: form.password, role: form.role, label: form.label || uname, ownerName: form.ownerName }]);
    }
    setShowForm(false); setEditingId(null);
  }

  function remove(u){
    if (u.role === "admin" && users.filter((x) => x.role === "admin").length <= 1) {
      alert("Impossible de supprimer le dernier compte administrateur.");
      return;
    }
    if (u.id === currentUserId) { alert("Tu ne peux pas supprimer ton propre compte pendant que tu es connecté avec."); return; }
    if (window.confirm(`Supprimer le compte "${u.username}" ?`)) setUsers(users.filter((x) => x.id !== u.id));
  }

  return (
    <div>
      <SectionTitle icon="🔐">Gestion des utilisateurs</SectionTitle>
      <div className="notice info" style={{marginBottom:16}}>
        <span className="ic">ℹ</span>
        <div>Ces comptes contrôlent l'accès au dashboard. Rappel : ce fichier étant statique (sans serveur), ce n'est pas
        une sécurité contre un accès malveillant — seulement un filtre d'usage pour séparer les rôles.</div>
      </div>
      <button className="btn primary" style={{marginBottom:16}} onClick={openNew}>+ Créer un utilisateur</button>

      {showForm && (
        <div className="card" style={{marginBottom:20, borderLeft:"4px solid var(--purple)"}}>
          <div style={{fontWeight:600, marginBottom:12}}>{editingId ? "Modifier l'utilisateur" : "Nouvel utilisateur"}</div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12}}>
            <div><p className="field-label">Identifiant</p><input style={{width:"100%"}} value={form.username} onChange={(e) => setForm({...form, username:e.target.value})} /></div>
            <div><p className="field-label">{editingId ? "Nouveau mot de passe (laisser vide pour ne pas changer)" : "Mot de passe"}</p><input type="text" style={{width:"100%"}} value={form.password} onChange={(e) => setForm({...form, password:e.target.value})} /></div>
            <div>
              <p className="field-label">Rôle</p>
              <select style={{width:"100%"}} value={form.role} onChange={(e) => setForm({...form, role:e.target.value})}>
                <option value="admin">Administrateur</option>
                <option value="user">Utilisateur</option>
              </select>
            </div>
            <div><p className="field-label">Nom affiché</p><input style={{width:"100%"}} value={form.label} onChange={(e) => setForm({...form, label:e.target.value})} placeholder="ex : Christophe" /></div>
            <div style={{gridColumn:"1 / -1"}}>
              <p className="field-label">Nom "Owner" lié (optionnel — permet à cet utilisateur de modifier ses propres actions dans le Plan d'action)</p>
              <select style={{width:"100%"}} value={form.ownerName} onChange={(e) => setForm({...form, ownerName:e.target.value})}>
                <option value="">Aucun</option>
                {MANAGERS.map((m) => <option key={m}>{m}</option>)}
              </select>
            </div>
          </div>
          {error && <div className="status-msg err" style={{marginTop:10}}>⚠ {error}</div>}
          <div style={{marginTop:14, display:"flex", gap:8}}>
            <button className="btn primary" onClick={save}>💾 Enregistrer</button>
            <button className="btn" onClick={() => { setShowForm(false); setEditingId(null); }}>Annuler</button>
          </div>
        </div>
      )}

      <div className="card" style={{padding:0, overflow:"hidden"}}>
        <table>
          <thead><tr>{["Identifiant","Nom affiché","Rôle","Owner lié",""].map((h) => <th key={h}>{h}</th>)}</tr></thead>
          <tbody>
            {users.map((u) => (
              <tr key={u.id}>
                <td>{u.username}{u.id === currentUserId ? " (toi)" : ""}</td>
                <td>{u.label}</td>
                <td>{u.role === "admin" ? "Administrateur" : "Utilisateur"}</td>
                <td>{u.ownerName || "—"}</td>
                <td>
                  <div style={{display:"flex", gap:4}}>
                    <button className="btn" style={{padding:"2px 8px", fontSize:12}} onClick={() => openEdit(u)}>✎ Modifier</button>
                    <button className="btn" style={{padding:"2px 8px", fontSize:12, color:"var(--red)"}} onClick={() => remove(u)}>🗑 Supprimer</button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function App(){
  const [auth, setAuth] = useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_AUTH_SESSION);
      return raw ? JSON.parse(raw) : null;
    } catch(err) { return null; }
  });
  const [tab, setTab] = useState("reporting");
  const [ecarts, setEcarts] = useState(SEED_ECARTS);
  const [weekly, setWeekly] = useState(SEED_WEEKLY);
  const [roster, setRoster] = useState(SEED_ROSTER);
  const [nccResponses, setNccResponses] = useState([]);
  const [allEvaluations, setAllEvaluations] = useState([]);
  const [planActions, setPlanActions] = useState([]);
  const [planActionsArchive, setPlanActionsArchive] = useState([]);
  const [criteresEcarts, setCriteresEcarts] = useState([]);
  const [itemsStats, setItemsStats] = useState([]);
  const [users, setUsers] = useState(SEED_USERS);
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [connStatus, setConnStatus] = useState("connecting"); // connecting | ok | unconfigured | error
  const [connError, setConnError] = useState("");
  const firstLoad = React.useRef(true);
  const remoteUpdateRef = React.useRef({ ecarts: null, weekly: null, roster: null, nccResponses: null, allEvaluations: null, planActions: null, planActionsArchive: null, criteresEcarts: null, itemsStats: null, users: null });

  // Chargement initial + abonnement temps réel
  useEffect(() => {
    let unsubEcarts = () => {};
    let unsubWeekly = () => {};
    let unsubRoster = () => {};
    let unsubNcc = () => {};
    let unsubEval = () => {};
    let unsubPlanActions = () => {};
    let unsubPlanActionsArchive = () => {};
    let unsubCriteres = () => {};
    let unsubItemsStats = () => {};
    let unsubUsers = () => {};

    (async () => {
      const resE = await fsLoad(STORAGE_KEY_ECARTS, SEED_ECARTS);
      const resW = await fsLoad(STORAGE_KEY_WEEKLY, SEED_WEEKLY);
      const resR = await fsLoad(STORAGE_KEY_ROSTER, SEED_ROSTER);
      const resN = await fsLoadChunked(STORAGE_KEY_NCC_RESPONSES, []);
      const resAE = await fsLoadChunked(STORAGE_KEY_ALL_EVALUATIONS, []);
      const resPA = await fsLoad(STORAGE_KEY_PLAN_ACTIONS, []);
      const resPAA = await fsLoad(STORAGE_KEY_PLAN_ACTIONS_ARCHIVE, []);
      const resCE = await fsLoadChunked(STORAGE_KEY_CRITERES_ECARTS, []);
      const resIS = await fsLoad(STORAGE_KEY_ITEMS_STATS, []);
      const resU = await fsLoad(STORAGE_KEY_USERS, SEED_USERS);
      // Le chargement initial ne doit jamais déclencher une ré-écriture immédiate :
      // on vient de lire cette donnée, pas besoin de la réenregistrer telle quelle.
      const initEcarts = resE.value, initWeekly = resW.value;
      const initRoster = resR.value && resR.value.length > 0 ? resR.value : SEED_ROSTER;
      const initNcc = resN.value || [], initAE = resAE.value || [], initPA = resPA.value || [];
      const initPAA = resPAA.value || [];
      const initCE = resCE.value || [], initIS = resIS.value || [];
      const initUsers = resU.value && resU.value.length > 0 ? resU.value : SEED_USERS;
      remoteUpdateRef.current = { ecarts: initEcarts, weekly: initWeekly, roster: initRoster, nccResponses: initNcc, allEvaluations: initAE, planActions: initPA, planActionsArchive: initPAA, criteresEcarts: initCE, itemsStats: initIS, users: initUsers };
      setEcarts(initEcarts);
      setWeekly(initWeekly);
      setRoster(initRoster);
      setNccResponses(initNcc);
      setAllEvaluations(initAE);
      setPlanActions(initPA);
      setPlanActionsArchive(initPAA);
      setCriteresEcarts(initCE);
      setItemsStats(initIS);
      setUsers(initUsers);
      setConnStatus(resE.status);
      setConnError(resE.error || "");
      setLoaded(true);
      firstLoad.current = false;

      if (resE.status === "ok") {
        unsubEcarts = fsSubscribe(STORAGE_KEY_ECARTS, (val) => { remoteUpdateRef.current.ecarts = val; setEcarts(val); });
        unsubWeekly = fsSubscribe(STORAGE_KEY_WEEKLY, (val) => { remoteUpdateRef.current.weekly = val; setWeekly(val); });
        unsubRoster = fsSubscribe(STORAGE_KEY_ROSTER, (val) => { const v = val && val.length > 0 ? val : SEED_ROSTER; remoteUpdateRef.current.roster = v; setRoster(v); });
        unsubNcc = fsSubscribeChunked(STORAGE_KEY_NCC_RESPONSES, (val) => { const v = val || []; remoteUpdateRef.current.nccResponses = v; setNccResponses(v); });
        unsubEval = fsSubscribeChunked(STORAGE_KEY_ALL_EVALUATIONS, (val) => { const v = val || []; remoteUpdateRef.current.allEvaluations = v; setAllEvaluations(v); });
        unsubPlanActions = fsSubscribe(STORAGE_KEY_PLAN_ACTIONS, (val) => { const v = val || []; remoteUpdateRef.current.planActions = v; setPlanActions(v); });
        unsubPlanActionsArchive = fsSubscribe(STORAGE_KEY_PLAN_ACTIONS_ARCHIVE, (val) => { const v = val || []; remoteUpdateRef.current.planActionsArchive = v; setPlanActionsArchive(v); });
        unsubCriteres = fsSubscribeChunked(STORAGE_KEY_CRITERES_ECARTS, (val) => { const v = val || []; remoteUpdateRef.current.criteresEcarts = v; setCriteresEcarts(v); });
        unsubItemsStats = fsSubscribe(STORAGE_KEY_ITEMS_STATS, (val) => { const v = val || []; remoteUpdateRef.current.itemsStats = v; setItemsStats(v); });
        unsubUsers = fsSubscribe(STORAGE_KEY_USERS, (val) => { const v = val && val.length > 0 ? val : SEED_USERS; remoteUpdateRef.current.users = v; setUsers(v); });
      }
    })();

    return () => { unsubEcarts(); unsubWeekly(); unsubRoster(); unsubNcc(); unsubEval(); unsubPlanActions(); unsubPlanActionsArchive(); unsubCriteres(); unsubItemsStats(); unsubUsers(); };
  }, []);

  // Sauvegarde (debounce) à chaque changement, une fois le chargement initial fait —
  // mais PAS si ce changement provient uniquement d'une mise à jour reçue de Firestore
  // (sinon un onglet resté ouvert peut "renvoyer" une donnée périmée en boucle).
  // Sauvegarde chaque donnée modifiée localement après une pause de 500ms d'inactivité —
  // mais PAS si ce changement provient uniquement d'une mise à jour reçue de Firestore
  // (sinon un onglet resté ouvert peut "renvoyer" une donnée périmée en boucle).
  // Chaque clé est jugée indépendamment (comparaison de référence avec la dernière valeur
  // reçue de Firestore) pour éviter qu'un écho reçu sur UNE clé n'annule la sauvegarde
  // légitime en cours d'une AUTRE clé (c'était la cause d'une perte silencieuse de données).
  useEffect(() => {
    if (!loaded) return;
    setSaving(true);
    const t = setTimeout(async () => {
      if (connStatus === "ok") {
        if (ecarts !== remoteUpdateRef.current.ecarts) { await fsSave(STORAGE_KEY_ECARTS, ecarts); remoteUpdateRef.current.ecarts = ecarts; }
        if (weekly !== remoteUpdateRef.current.weekly) { await fsSave(STORAGE_KEY_WEEKLY, weekly); remoteUpdateRef.current.weekly = weekly; }
        if (roster !== remoteUpdateRef.current.roster) { await fsSave(STORAGE_KEY_ROSTER, roster); remoteUpdateRef.current.roster = roster; }
        if (nccResponses !== remoteUpdateRef.current.nccResponses) { await fsSaveChunked(STORAGE_KEY_NCC_RESPONSES, nccResponses); remoteUpdateRef.current.nccResponses = nccResponses; }
        if (allEvaluations !== remoteUpdateRef.current.allEvaluations) { await fsSaveChunked(STORAGE_KEY_ALL_EVALUATIONS, allEvaluations); remoteUpdateRef.current.allEvaluations = allEvaluations; }
        if (planActions !== remoteUpdateRef.current.planActions) { await fsSave(STORAGE_KEY_PLAN_ACTIONS, planActions); remoteUpdateRef.current.planActions = planActions; }
        if (planActionsArchive !== remoteUpdateRef.current.planActionsArchive) { await fsSave(STORAGE_KEY_PLAN_ACTIONS_ARCHIVE, planActionsArchive); remoteUpdateRef.current.planActionsArchive = planActionsArchive; }
        if (criteresEcarts !== remoteUpdateRef.current.criteresEcarts) { await fsSaveChunked(STORAGE_KEY_CRITERES_ECARTS, criteresEcarts); remoteUpdateRef.current.criteresEcarts = criteresEcarts; }
        if (itemsStats !== remoteUpdateRef.current.itemsStats) { await fsSave(STORAGE_KEY_ITEMS_STATS, itemsStats); remoteUpdateRef.current.itemsStats = itemsStats; }
        if (users !== remoteUpdateRef.current.users) { await fsSave(STORAGE_KEY_USERS, users); remoteUpdateRef.current.users = users; }
      }
      setSaving(false);
    }, 500);
    return () => clearTimeout(t);
  }, [ecarts, weekly, roster, nccResponses, allEvaluations, planActions, planActionsArchive, criteresEcarts, itemsStats, users, loaded, connStatus]);

  async function saveNow(ecartsToSave, weeklyToSave){
    if (connStatus !== "ok") return { ok: false, reason: connStatus };
    setSaving(true);
    await fsSave(STORAGE_KEY_ECARTS, ecartsToSave);
    await fsSave(STORAGE_KEY_WEEKLY, weeklyToSave);
    setSaving(false);
    return { ok: true };
  }

  function importFromJSON(data){
    if (Array.isArray(data.ecarts)) setEcarts(data.ecarts.map((e) => ({...e, id: e.id ?? uid()})));
    if (Array.isArray(data.historique_kpi)) setWeekly(data.historique_kpi);
    if (Array.isArray(data.repartition_equipes)) setRoster(data.repartition_equipes);
    if (Array.isArray(data.ncc_responses)) setNccResponses(data.ncc_responses);
    if (Array.isArray(data.toutes_evaluations)) setAllEvaluations(data.toutes_evaluations);
    if (Array.isArray(data.plan_actions)) setPlanActions(data.plan_actions.map((p) => ({...p, id: p.id ?? uid()})));
    if (Array.isArray(data.criteres_ecarts)) setCriteresEcarts(data.criteres_ecarts);
    if (Array.isArray(data.items_stats)) setItemsStats(data.items_stats);
  }

  /* Intègre automatiquement les écarts détectés depuis les évaluations brutes (14 derniers jours, sous
     objectif ou KO) dans le suivi débriefing — sans action manuelle. Se stabilise tout seul : une fois
     ajoutés, ces écarts sont "connus" et ne sont plus proposés une seconde fois. */
  useEffect(() => {
    if (!auth) return;
    if ((!ecarts || ecarts.length === 0) && (!allEvaluations || allEvaluations.length === 0)) return;
    const pending = computeAutoDetectedEcarts(allEvaluations, ecarts, roster);
    if (pending.length === 0) return;
    const startId = ecarts.reduce((max, e) => Math.max(max, Number(e.id) || 0), 0) + 1;
    const promoted = pending.map((item, i) => ({
      id: startId + i, indicateur: item.indicateur, conseiller: item.conseiller, reference: "",
      semaine: item.semaine, date: item.date, ecart: item.ecart, statut: "À traiter", action: "",
      dateDebrief: "", constat: "Détecté automatiquement depuis les évaluations brutes.",
      managerDispatch: item.managerDispatch, manager: item.manager, alerte: "",
    }));
    const updated = [...ecarts, ...promoted];
    setEcarts(updated);
    if (connStatus === "ok") saveNow(updated, weekly);
  }, [allEvaluations, roster, ecarts, auth, connStatus]);

  function handleLogin(session){
    try { localStorage.setItem(STORAGE_KEY_AUTH_SESSION, JSON.stringify(session)); } catch(err) {}
    setAuth(session);
    setTab(session.role === "admin" ? "reporting" : "reporting");
  }
  function handleLogout(){
    try { localStorage.removeItem(STORAGE_KEY_AUTH_SESSION); } catch(err) {}
    setAuth(null);
  }

  const allTabs = [
    { id:"reporting", label:"Reporting", icon:"📊" },
    { id:"performance", label:"Suivi performance", icon:"📈" },
    { id:"debriefing", label:"Suivi débriefing", icon:"📋" },
    { id:"analyse", label:"Analyse", icon:"🔍" },
    { id:"plan_action", label:"Plan d'action", icon:"🎯" },
    { id:"roster", label:"Répartition équipe", icon:"🧑‍🤝‍🧑" },
    { id:"nps", label:"Analyse NPS", icon:"⭐" },
    { id:"import", label:"Importer", icon:"⬆" },
    { id:"export", label:"Extractions", icon:"🗄" },
    { id:"users", label:"Gestion utilisateurs", icon:"🔐" },
  ];
  const tabs = auth && auth.role === "admin" ? allTabs : allTabs.filter((t) => !ADMIN_ONLY_TABS.has(t.id));

  useEffect(() => {
    if (!auth) return;
    if (ADMIN_ONLY_TABS.has(tab) && auth.role !== "admin") setTab("reporting");
  }, [auth, tab]);

  const statusLabel = {
    connecting: "Connexion...",
    ok: saving ? "Enregistrement..." : "Connecté — partagé en ligne (Firebase)",
    unconfigured: "Mode local — Firebase non configuré (voir README)",
    error: "Erreur de connexion Firebase — données non partagées",
  }[connStatus];

  if (!auth) return <LoginScreen onLogin={handleLogin} users={users} />;

  return (
    <div>
      <div className="header">
        <div className="wrap header-inner">
          <div>
            <h1>Suivi Qualité — TERSEA Madagascar</h1>
            <p>Débriefings managers · Reporting · Compte Auchan · Site Mada</p>
          </div>
          <div className="status" style={{display:"flex", alignItems:"center", gap:10}}>
            <span>💾 {statusLabel}</span>
            <span style={{opacity:0.85}}>· {auth.label} ({auth.username})</span>
            <button className="btn" style={{padding:"3px 10px", fontSize:12}} onClick={handleLogout}>Se déconnecter</button>
          </div>
        </div>
      </div>

      {connStatus === "unconfigured" && (
        <div className="wrap" style={{paddingTop:14}}>
          <div className="notice warn">
            <span className="ic">⚠</span>
            <div>
              Firebase n'est pas encore configuré : les données sont conservées uniquement dans <strong>ce
              navigateur</strong>, pas partagées avec les autres. Suis les étapes du fichier <code>README.md</code>
              (créer un projet Firebase gratuit, activer Firestore, coller la config en haut du fichier HTML) pour
              activer le partage en ligne entre utilisateurs.
            </div>
          </div>
        </div>
      )}
      {connStatus === "error" && (
        <div className="wrap" style={{paddingTop:14}}>
          <div className="notice warn">
            <span className="ic">⚠</span>
            <div>Impossible de se connecter à Firebase ({connError || "erreur inconnue"}). Vérifie la configuration
            et les règles Firestore (fichier <code>firestore.rules</code>). En attendant, les modifications restent
            en mémoire locale et seront perdues à la fermeture de la page.</div>
          </div>
        </div>
      )}

      <div className="tabs">
        <div className="wrap tabs-inner">
          {tabs.map((t) => (
            <button key={t.id} className={"tab-btn" + (tab===t.id ? " active" : "")} onClick={() => setTab(t.id)}>
              {t.icon} {t.label}
            </button>
          ))}
        </div>
      </div>

      <div className="wrap content">
        {tab === "reporting" && <ReportingView ecarts={ecarts} weekly={weekly} roster={roster} allEvaluations={allEvaluations} />}
        {tab === "performance" && <PerformanceView ecarts={ecarts} weekly={weekly} roster={roster} allEvaluations={allEvaluations} />}
        {tab === "debriefing" && <DebriefingView ecarts={ecarts} setEcarts={setEcarts} weekly={weekly} onSaveNow={saveNow} roster={roster} allEvaluations={allEvaluations} criteresEcarts={criteresEcarts} />}
        {tab === "analyse" && <AnalyseView ecarts={ecarts} roster={roster} allEvaluations={allEvaluations} nccResponses={nccResponses} criteresEcarts={criteresEcarts} itemsStats={itemsStats} />}
        {tab === "plan_action" && <PlanActionView ecarts={ecarts} roster={roster} allEvaluations={allEvaluations} criteresEcarts={criteresEcarts} itemsStats={itemsStats} planActions={planActions} setPlanActions={setPlanActions} planActionsArchive={planActionsArchive} setPlanActionsArchive={setPlanActionsArchive} auth={auth} />}
        {tab === "roster" && auth.role === "admin" && <RosterView roster={roster} setRoster={setRoster} />}
        {tab === "nps" && <NPSView nccResponses={nccResponses} roster={roster} />}
        {tab === "import" && auth.role === "admin" && <ImportView ecarts={ecarts} setEcarts={setEcarts} onImportJSON={importFromJSON} roster={roster} setRoster={setRoster} nccResponses={nccResponses} setNccResponses={setNccResponses} allEvaluations={allEvaluations} setAllEvaluations={setAllEvaluations} />}
        {tab === "export" && auth.role === "admin" && <ExportView ecarts={ecarts} weekly={weekly} roster={roster} nccResponses={nccResponses} allEvaluations={allEvaluations} planActions={planActions} criteresEcarts={criteresEcarts} itemsStats={itemsStats} />}
        {tab === "users" && auth.role === "admin" && <UserManagementView users={users} setUsers={setUsers} currentUserId={auth.userId} />}
      </div>

      <div className="footer">
        TERSEA · Site Mada · Compte Auchan — {connStatus === "ok" ? "données partagées en ligne via Firebase" : "voir README.md pour activer le partage en ligne"}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
