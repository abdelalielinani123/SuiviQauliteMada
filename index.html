    if (fManager !== "Tous" && r.manager !== fManager) return false;
    if (fStatut !== "Tous" && r.statut !== fStatut) return false;
    if (search && !r.conseiller.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }).sort((a,b) => displayConseillerName(a.conseiller).localeCompare(displayConseillerName(b.conseiller))), [roster, fManager, fStatut, search]);

  function addEntry(form){
    setRoster([...(roster||[]), { conseiller: form.conseiller.trim(), manager: form.manager, site: "MADA", statut: form.statut, dateEntreeProd: "" }]);
    setModalMode(null);
  }
  function updateEntry(originalConseiller, form){
    setRoster((roster||[]).map((r) => r.conseiller === originalConseiller ? { ...r, manager: form.manager, statut: form.statut } : r));
    setModalMode(null);
  }
  function deleteEntry(conseiller){
    setRoster((roster||[]).filter((r) => r.conseiller !== conseiller));
    setConfirmDelete(null);
  }

  const editingEntry = (typeof modalMode === "string" && modalMode !== "add")
    ? (roster || []).find((r) => r.conseiller === modalMode)
    : null;

  return (
    <div>
      <SectionTitle icon="🧑‍🤝‍🧑">Répartition d'équipe</SectionTitle>

      <div className="notice info" style={{marginBottom:16}}>
        <span className="ic">ℹ</span>
        <div>Cette répartition sert à retrouver automatiquement le manager d'un conseiller (Suivi débriefing, Reporting)
        et à distinguer Nouveau/Ancien/Départ. Les modifications ici sont partagées en ligne comme le reste du tableau de bord.</div>
      </div>

      <div className="filters" style={{marginBottom:14}}>
        <div className="search-box">
          🔍
          <input placeholder="Rechercher un conseiller..." value={search} onChange={(e) => setSearch(e.target.value)} />
        </div>
        <select value={fManager} onChange={(e) => setFManager(e.target.value)}>
          <option>Tous</option>{["Christopha","Ibra","Rojo"].map((m) => <option key={m}>{m}</option>)}
        </select>
        <select value={fStatut} onChange={(e) => setFStatut(e.target.value)}>
          <option>Tous</option><option>Ancien</option><option>Nouveau</option><option>Départ</option>
        </select>
        <button className="btn primary" onClick={() => setModalMode("add")}>+ Ajouter un conseiller</button>
      </div>

      <div style={{fontSize:12, color:"var(--textMuted)", marginBottom:8}}>{filtered.length} conseiller(s) affiché(s) sur {(roster||[]).length}</div>

      <div className="card" style={{padding:0, overflow:"hidden"}}>
        <table>
          <thead><tr>{["Conseiller","Manager","Statut",""].map((h) => <th key={h}>{h}</th>)}</tr></thead>
          <tbody>
            {filtered.map((r, i) => (
              <tr key={r.conseiller+"-"+i} style={{backgroundColor: i%2 ? "var(--grey)" : "#fff"}}>
                <td>{displayConseillerName(r.conseiller)}</td>
                <td>{r.manager}</td>
                <td>
                  <span className={"badge " + (r.statut==="Départ" ? "KO" : r.statut==="Nouveau" ? "atraiter" : "OK")}>{r.statut || "—"}</span>
                </td>
                <td style={{whiteSpace:"nowrap"}}>
                  <button className="btn" style={{padding:"4px 10px", fontSize:12, marginRight:6}} onClick={() => setModalMode(r.conseiller)}>Modifier</button>
                  <button className="btn" style={{padding:"4px 10px", fontSize:12, color:"var(--red)", background:"var(--redSoft)"}} onClick={() => setConfirmDelete(r.conseiller)}>Supprimer</button>
                </td>
              </tr>
            ))}
            {filtered.length === 0 && <tr><td colSpan="4" style={{textAlign:"center", padding:20, color:"var(--textMuted)"}}>Aucun conseiller ne correspond à ces filtres.</td></tr>}
          </tbody>
        </table>
      </div>

      {modalMode === "add" && (
        <RosterAddEditModal onClose={() => setModalMode(null)} onSave={addEntry} />
      )}
      {editingEntry && (
        <RosterAddEditModal
          initial={{ conseiller: editingEntry.conseiller, manager: editingEntry.manager === "RAS" ? "Ibra" : editingEntry.manager, statut: editingEntry.statut }}
          onClose={() => setModalMode(null)}
          onSave={(form) => updateEntry(editingEntry.conseiller, form)}
        />
      )}
      {confirmDelete && (
        <div className="modal-overlay">
          <div className="modal" style={{maxWidth:380}}>
            <h3>Supprimer ce conseiller ?</h3>
            <p style={{fontSize:13, color:"var(--textMuted)"}}>
              « {displayConseillerName(confirmDelete)} » sera retiré de la répartition d'équipe. Les écarts déjà
              enregistrés pour ce conseiller resteront, mais son manager ne sera plus retrouvé automatiquement.
            </p>
            <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:10}}>
              <button className="btn" onClick={() => setConfirmDelete(null)}>Annuler</button>
              <button className="btn" style={{color:"var(--red)", background:"var(--redSoft)"}} onClick={() => deleteEntry(confirmDelete)}>Supprimer</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   VUE : ANALYSE NPS
   ============================================================ */
function NPSView({ nccResponses, roster }) {
  const [granularity, setGranularity] = useState("tous");
  const [periodValue, setPeriodValue] = useState([]);
  const [dateRange, setDateRange] = useState({ start:"", end:"" });
  const [fManager, setFManager] = useState([]);
  const [fAgent, setFAgent] = useState("Tous");
  const [fEquipe, setFEquipe] = useState("Tous");
  const [onlyToAnalyze, setOnlyToAnalyze] = useState(false);
  const [expanded, setExpanded] = useState(null);

  const responses = nccResponses || [];

  const withManager = useMemo(() => responses.map((r) => ({
    ...r,
    manager: getConseillerManagerFromRoster(r.conseillerFull, roster) || "Non trouvé",
    equipe: getConseillerStatus(r.conseillerFull, roster),
  })), [responses, roster]);

  const weekOptions = useMemo(() => {
    const set = new Set();
    withManager.forEach((r) => {
      if (r.date) {
        const d = new Date(r.date);
        if (!isNaN(d)) set.add("S" + getISOWeekLabel(d));
      }
    });
    return [...set].filter(Boolean).sort();
  }, [withManager]);
  const monthOptions = useMemo(() => {
    const set = new Set();
    withManager.forEach((r) => { if (r.date) set.add(getMonthLabel(r.date)); });
    return [...set].filter(Boolean);
  }, [withManager]);
  const dayOptions = useMemo(() => {
    const set = new Set(withManager.map((r) => r.date).filter(Boolean));
    return [...set].sort();
  }, [withManager]);
  const managerOptions = useMemo(() => {
    const set = new Set(withManager.map((r) => r.manager).filter(Boolean));
    return [...set].sort();
  }, [withManager]);
  const agentOptions = useMemo(() => {
    const set = new Set(withManager.filter((r) => fManager.length === 0 || fManager.includes(r.manager)).map((r) => r.conseiller));
    return [...set].sort();
  }, [withManager, fManager]);
  const equipeOptions = ["Nouveau", "Ancien", "Départ", "Non renseigné"];

  const filtered = useMemo(() => withManager.filter((r) => {
    if (fManager.length > 0 && !fManager.includes(r.manager)) return false;
    if (fAgent !== "Tous" && r.conseiller !== fAgent) return false;
    if (fEquipe !== "Tous" && r.equipe !== fEquipe) return false;
    if (granularity === "plage") {
      if (!dateInRange(r.date, dateRange)) return false;
    } else if (granularity !== "tous" && periodValue.length > 0 && r.date) {
      if (granularity === "jour" && !periodValue.includes(r.date)) return false;
      if (granularity === "semaine" && !periodValue.includes("S"+getISOWeekLabel(new Date(r.date)))) return false;
      if (granularity === "mois" && !periodValue.includes(getMonthLabel(r.date))) return false;
    } else if (granularity !== "tous" && granularity !== "plage" && periodValue.length > 0 && !r.date) {
      return false;
    }
    if (onlyToAnalyze) {
      const ncc = r.scoreNCC !== null && r.scoreNCC <= 7;
      const nps = r.scoreNPS !== null && r.scoreNPS <= 7;
      if (!ncc && !nps) return false;
    }
    return true;
  }), [withManager, fManager, fAgent, fEquipe, granularity, periodValue, dateRange, onlyToAnalyze]);

  const avgNCC = useMemo(() => {
    const withScore = filtered.filter((r) => r.scoreNCC !== null);
    return withScore.length ? Math.round((withScore.reduce((a,b) => a+b.scoreNCC, 0)/withScore.length)*10)/10 : null;
  }, [filtered]);
  const nps = useMemo(() => computeAggregateNPS(filtered), [filtered]);
  const toAnalyzeCount = useMemo(() => withManager.filter((r) => (r.scoreNCC !== null && r.scoreNCC <= 7) || (r.scoreNPS !== null && r.scoreNPS <= 7)).length, [withManager]);

  return (
    <div>
      <SectionTitle icon="⭐">Analyse NPS</SectionTitle>

      {responses.length === 0 ? (
        <div className="notice warn" style={{marginBottom:16}}>
          <span className="ic">⚠</span>
          <div>Aucune réponse NCC chargée — importe le fichier d'enquête satisfaction dans l'onglet Importer (section « Importer les réponses NCC ») pour alimenter cette vue.</div>
        </div>
      ) : (
        <div className="notice info" style={{marginBottom:16}}>
          <span className="ic">ℹ</span>
          <div>Le NPS agrégé = % promoteurs (note 9-10) − % détracteurs (note 0-6) sur la question 4. Le canal
          (téléphone/mail) n'est pas fourni par le fichier d'enquête source — non affiché pour l'instant.</div>
        </div>
      )}

      <PeriodFilter
        granularity={granularity} setGranularity={setGranularity}
        value={periodValue} setValue={setPeriodValue}
        weekOptions={weekOptions} monthOptions={monthOptions} dayOptions={dayOptions}
        allowRange={true} dateRange={dateRange} setDateRange={setDateRange}
      />

      <div className="filters" style={{marginBottom:14, marginTop:-8}}>
        <MultiSelectDropdown label="Manager :" options={managerOptions} selected={fManager} setSelected={(v) => { setFManager(v); setFAgent("Tous"); }} />
        <span style={{fontSize:12, color:"var(--textMuted)", fontWeight:600, marginLeft:8}}>Agent :</span>
        <select value={fAgent} onChange={(e) => setFAgent(e.target.value)}>
          <option>Tous</option>{agentOptions.map((a) => <option key={a}>{a}</option>)}
        </select>
        <span style={{fontSize:12, color:"var(--textMuted)", fontWeight:600, marginLeft:8}}>Équipe (Mada) :</span>
        <select value={fEquipe} onChange={(e) => setFEquipe(e.target.value)}>
          <option>Tous</option>{equipeOptions.map((s) => <option key={s}>{s}</option>)}
        </select>
        <label style={{display:"flex", alignItems:"center", gap:6, fontSize:13, marginLeft:8, cursor:"pointer"}}>
          <input type="checkbox" checked={onlyToAnalyze} onChange={(e) => setOnlyToAnalyze(e.target.checked)} />
          À analyser (NCC ou NPS ≤ 7)
        </label>
      </div>

      <div className="stat-row" style={{marginBottom:16}}>
        <StatCard label="Réponses (filtre actif)" value={filtered.length} tone="neutral" />
        <StatCard label="Note NCC moyenne" value={avgNCC !== null ? avgNCC+"/10" : "—"} tone={avgNCC!==null && avgNCC<8.1 ? "bad":"good"} />
        <StatCard label="Score NPS agrégé" value={nps !== null ? nps : "—"} tone={nps!==null && nps<0 ? "bad":"good"} sub="% promoteurs − % détracteurs" />
        <StatCard label="À analyser (total)" value={toAnalyzeCount} tone={toAnalyzeCount>0 ? "bad":"good"} />
      </div>

      <div className="card" style={{padding:0, overflow:"hidden"}}>
        <div style={{overflowX:"auto"}}>
          <table>
            <thead>
              <tr>{["Manager","Agent","Équipe","Date","N° demande","Canal","Score NCC","Score NPS"].map((h) => <th key={h}>{h}</th>)}</tr>
            </thead>
            <tbody>
              {filtered.slice(0,300).map((r) => {
                const toAnalyze = (r.scoreNCC !== null && r.scoreNCC <= 7) || (r.scoreNPS !== null && r.scoreNPS <= 7);
                return (
                  <Fragment key={r.ndemande}>
                    <tr className={toAnalyze ? "alert-row" : ""}>
                      <td>{r.manager}</td>
                      <td>{r.conseiller}</td>
                      <td style={{fontSize:12, color:"var(--textMuted)"}}>{r.equipe}</td>
                      <td style={{whiteSpace:"nowrap"}}>{r.date || "—"}</td>
                      <td>
                        <button className="btn" style={{padding:"2px 8px", fontSize:12}} onClick={() => setExpanded(expanded===r.ndemande ? null : r.ndemande)}>
                          {r.ndemande} {expanded===r.ndemande ? "▴" : "▾"}
                        </button>
                      </td>
                      <td style={{fontSize:12, color:"var(--textMuted)"}}>Non déterminé</td>
                      <td style={{fontWeight:600, color: r.scoreNCC!==null && r.scoreNCC<=7 ? "var(--red)" : "var(--green)"}}>{r.scoreNCC !== null ? r.scoreNCC+"/10" : "—"}</td>
                      <td style={{fontWeight:600, color: r.scoreNPS!==null && r.scoreNPS<=7 ? "var(--red)" : "var(--green)"}}>{r.scoreNPS !== null ? r.scoreNPS : "—"}</td>
                    </tr>
                    {expanded === r.ndemande && (
                      <tr>
                        <td colSpan="8" style={{background:"var(--purpleSoft)", padding:"12px 16px"}}>
                          <div style={{fontSize:12, fontWeight:600, color:"var(--purpleDark)", marginBottom:4}}>Motif principal</div>
                          <div style={{fontSize:13, marginBottom:8}}>{r.motif || "—"}</div>
                          <div style={{fontSize:12, fontWeight:600, color:"var(--purpleDark)", marginBottom:4}}>Verbatim client</div>
                          <div style={{fontSize:13}}>{r.verbatim || "Aucun commentaire renseigné."}</div>
                        </td>
                      </tr>
                    )}
                  </Fragment>
                );
              })}
              {filtered.length === 0 && (
                <tr><td colSpan="8" style={{textAlign:"center", padding:20, color:"var(--textMuted)"}}>Aucune réponse ne correspond à ces filtres.</td></tr>
              )}
            </tbody>
          </table>
        </div>
        {filtered.length > 300 && (
          <div style={{textAlign:"center", padding:8, fontSize:12, color:"var(--textMuted)"}}>Affichage limité à 300 lignes — affine les filtres pour voir le reste.</div>
        )}
      </div>
    </div>
  );
}

function ImportView({ ecarts, setEcarts, onImportJSON, roster, setRoster, nccResponses, setNccResponses, allEvaluations, setAllEvaluations }) {
  const [status, setStatus] = useState(null);
  const [jsonStatus, setJsonStatus] = useState(null);
  const [rosterStatus, setRosterStatus] = useState(null);
  const [nccStatus, setNccStatus] = useState(null);
  const [evalStatus, setEvalStatus] = useState(null);
  const [preview, setPreview] = useState([]);

  function handleAllEvaluationsFile(file){
    const isExcel = /\.xlsx?$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        let rows = [];
        if (isExcel) {
          const wb = XLSX.read(evt.target.result, {type:"binary"});
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
        } else {
          rows = Papa.parse(evt.target.result, {header:true, skipEmptyLines:true}).data;
        }
        const mapped = rows.map((r) => ({
          indicateur: r["Indicateur"] || r["indicateur"] || "",
          conseiller: String(r["Conseiller"] || r["conseiller"] || "").trim(),
          score: r["Score"] !== undefined && r["Score"] !== "" ? Number(r["Score"]) : (r["score"] !== undefined && r["score"] !== "" ? Number(r["score"]) : null),
          statut: r["Statut"] || r["statut"] || "",
          date: r["Date"] || r["date"] || "",
          semaine: r["Semaine"] || r["semaine"] || "",
        })).filter((r) => r.conseiller && r.indicateur);

        const key = (r) => [r.indicateur, r.conseiller, r.date, r.semaine, r.score, r.statut].join("|");
        const existingKeys = new Set((allEvaluations||[]).map(key));
        const news = mapped.filter((r) => !existingKeys.has(key(r)));
        setAllEvaluations([...(allEvaluations||[]), ...news]);
        setEvalStatus({ ok:true, msg: `${mapped.length} évaluation(s) lue(s), ${news.length} nouvelle(s) ajoutée(s) (${mapped.length-news.length} doublon(s) ignoré(s)).` });
      } catch(err){
        setEvalStatus({ ok:false, msg:"Fichier illisible — colonnes attendues : Indicateur, Conseiller, Score (Voix/Mail/NCC) ou Statut (OK/KO/SI pour Process/Transfert), Date, Semaine." });
      }
    };
    if (isExcel) reader.readAsBinaryString(file); else reader.readAsText(file);
  }
  function downloadEvalTemplate(){
    exportCSV([
      { Indicateur:"Hubicus Voix", Conseiller:"Rosa", Score:91, Statut:"", Date:"2026-07-20", Semaine:"S29" },
      { Indicateur:"Taux de conformité des transferts en file d'attente", Conseiller:"Rosa", Score:"", Statut:"OK", Date:"2026-07-20", Semaine:"S29" },
    ], "modele_toutes_evaluations.csv");
  }

  function handleNCCImportFile(file){
    const isExcel = /\.xlsx?$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        let rows = [];
        if (isExcel) {
          const wb = XLSX.read(evt.target.result, {type:"binary"});
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
        } else {
          rows = Papa.parse(evt.target.result, {header:true, skipEmptyLines:true}).data;
        }
        const parsed = parseNCCRows(rows);
        const existingKeys = new Set((nccResponses||[]).map((p) => p.ndemande));
        const news = parsed.filter((p) => !existingKeys.has(p.ndemande));
        setNccResponses([...(nccResponses||[]), ...news]);
        setNccStatus({ ok:true, msg: `${parsed.length} réponse(s) lue(s) dans le fichier, dont ${news.length} nouvelle(s) ajoutée(s) (${parsed.length-news.length} doublon(s) ignoré(s) par N° demande).` });
      } catch(err){
        setNccStatus({ ok:false, msg:"Fichier illisible — colonnes attendues : Conseiller, N° Demande, Question, Réponse, Date de L'enquête (format 'une ligne par question', comme les exports Reporting_Satisfaction_Client)." });
      }
    };
    if (isExcel) reader.readAsBinaryString(file); else reader.readAsText(file);
  }

  function handleRosterFile(file){
    const isExcel = /\.xlsx?$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        let rows = [];
        if (isExcel) {
          const wb = XLSX.read(evt.target.result, {type:"binary"});
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
        } else {
          rows = Papa.parse(evt.target.result, {header:true, skipEmptyLines:true}).data;
        }
        const mapped = rows.map((r) => {
          const conseillerRaw = r["Conseiller"] || r["conseiller"] || r["Nom complet"] || r["Diamant"] || r["Nom"] || r["log mail"] || "";
          const managerRaw = r["Manager"] || r["manager"] || "";
          const statutRaw = r["Statut"] || r["statut"] || r["Nouveau/Ancien"] || r["Nouveau / Ancien"] || r["Anciennét"] || r["Ancienneté"] || "";
          const dateEntree = r["Date d'entrée en prod"] || r["Date d'entrée"] || r["dateEntreeProd"] || "";
          return {
            conseiller: String(conseillerRaw).trim(),
            manager: String(managerRaw).trim(),
            site: String(r["Site"] || r["site"] || r["SITE"] || "").trim(),
            statut: ["Nouveau","Ancien","Départ"].includes(statutRaw) ? statutRaw : "",
            dateEntreeProd: dateEntree ? String(dateEntree) : "",
          };
        }).filter((r) => r.conseiller)
          .filter((r) => !r.site || /mada/i.test(r.site)); // ne conserver que le site Mada quand un site est renseigné
        setRoster(mapped);
        setRosterStatus({ok:true, msg: mapped.length+" conseiller(s) chargé(s) dans la répartition des équipes. Ce contenu remplace la répartition précédente."});
      } catch(err){
        setRosterStatus({ok:false, msg:"Fichier illisible — colonnes attendues : Conseiller, Manager, Site (optionnel), Statut ou Date d'entrée en prod (optionnel)."});
      }
    };
    if (isExcel) reader.readAsBinaryString(file); else reader.readAsText(file);
  }

  function downloadRosterTemplate(){
    exportCSV([
      { Conseiller:"Rosa", Manager:"Ibra", Site:"MADA", Statut:"Ancien", "Date d'entrée en prod":"" },
      { Conseiller:"Jacky", Manager:"Rojo", Site:"MADA", Statut:"Nouveau", "Date d'entrée en prod":"2026-06-01" },
    ], "modele_repartition_equipes.csv");
  }

  function handleJSONFile(file){
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        if (!Array.isArray(data.ecarts)) throw new Error("format invalide");
        onImportJSON(data);
        setJsonStatus({ok:true, msg: "Chargé : "+data.ecarts.length+" écart(s)"+(data.historique_kpi ? " et "+data.historique_kpi.length+" semaine(s) d'historique" : "")+". Ce contenu remplace les données actuelles."});
      } catch(err){
        setJsonStatus({ok:false, msg:"JSON illisible — vérifie qu'il s'agit bien d'un export généré par ce tableau de bord."});
      }
    };
    reader.readAsText(file);
  }

  function handleFile(file){
    const isExcel = /\.xlsx?$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        let rows = [];
        if (isExcel) {
          const wb = XLSX.read(evt.target.result, {type:"binary"});
          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
        } else {
          rows = Papa.parse(evt.target.result, {header:true, skipEmptyLines:true}).data;
        }
        setPreview(rows.slice(0,8));
        const mapped = rows.map((r) => ({
          id: uid(),
          indicateur: r["Indicateur"] || r["indicateur"] || "Hubicus Voix",
          conseiller: r["Conseiller"] || r["conseiller"] || "",
          reference: r["Référence"] || r["reference"] || r["N° de ticket"] || "",
          semaine: r["Semaine"] || r["semaine"] || "",
          date: r["Date"] || r["date"] || "",
          ecart: r["Écart constaté"] || r["ecart"] || "",
          statut: r["Débriefing (OK/KO)"] || r["statut"] || "À traiter",
          action: r["Action réalisée"] || r["action"] || "",
          dateDebrief: r["Date du débriefing"] || "",
          constat: r["Constat détaillé"] || r["constat"] || "",
          managerDispatch: r["Manager (dispatch)"] || "",

          alerte: r["Alerte récurrence"] || "",
        })).filter((r) => r.conseiller);
        const existingRefs = new Set(ecarts.map((e) => e.reference));

        setEcarts((prev) => [...prev, ...news]);
        setStatus({ok:true, msg: news.length+" nouvelle(s) ligne(s) ajoutée(s) ("+(mapped.length-news.length)+" doublon(s) ignoré(s) par référence)."});
      } catch(err){
        setStatus({ok:false, msg:"Fichier illisible — vérifie les colonnes attendues (Indicateur, Conseiller, Référence, Semaine, Date, Écart constaté...)."});
      }
    };
    if (isExcel) reader.readAsBinaryString(file); else reader.readAsText(file);
  }

/* Score global "réalisé" pour un indicateur, toutes évaluations confondues (aucun filtre manager/période). */
function computeGlobalKpiRealise(ecarts, allEvaluations, kpi){
  const evalsForKpi = (allEvaluations || []).filter((ev) => ev.indicateur === kpi);
  const isNumeric = kpi === "Hubicus Voix" || kpi === "Hubicus Mail" || kpi.includes("NCC");
  if (evalsForKpi.length > 0) {
    if (isNumeric) {
      const scored = evalsForKpi.filter((e) => e.score !== null && e.score !== undefined && e.score !== "");
      return scored.length ? Math.round((scored.reduce((s,e) => s+Number(e.score), 0)/scored.length)*10)/10 : null;
    }
    const withStatut = evalsForKpi.filter((e) => ["OK","KO","SI"].includes(e.statut));
    const ok = withStatut.filter((e) => e.statut === "OK").length;
    return withStatut.length ? Math.round((ok/withStatut.length)*1000)/10 : null;
  }
  const rel = ecarts.filter((e) => e.indicateur === kpi).map(parseScoreFromEcart).filter(Boolean);
  return rel.length ? Math.round((rel.reduce((s,p) => s+p.value, 0)/rel.length)*10)/10 : null;
}

/* Résultat "post-coaching" d'une action : moyenne/taux calculé automatiquement sur les évaluations
   postérieures à l'échéance, pour le conseiller ciblé (ou toute l'équipe). Se met à jour tout seul
   au fil des extractions injectées — aucune saisie manuelle. */
function computeResultatPostCoaching(action, allEvaluations){
  if (!action.echeance) return null;
  const evalsForKpi = (allEvaluations || []).filter((ev) => ev.indicateur === action.indicateur && ev.date && ev.date > action.echeance);
  const scoped = (action.conseillerCible && action.conseillerCible !== "Toute l'équipe")
    ? evalsForKpi.filter((ev) => displayConseillerName(ev.conseiller) === action.conseillerCible)
    : evalsForKpi;
  if (scoped.length === 0) return null;
  const isNumeric = action.indicateur === "Hubicus Voix" || action.indicateur === "Hubicus Mail" || action.indicateur.includes("NCC");
  if (isNumeric) {
    const scored = scoped.filter((e) => e.score !== null && e.score !== undefined && e.score !== "");
    return scored.length ? { value: Math.round((scored.reduce((s,e) => s+Number(e.score), 0)/scored.length)*10)/10, nb: scored.length } : null;
  }
  const withStatut = scoped.filter((e) => ["OK","KO","SI"].includes(e.statut));
  const ok = withStatut.filter((e) => e.statut === "OK").length;
  return withStatut.length ? { value: Math.round((ok/withStatut.length)*1000)/10, nb: withStatut.length } : null;
}

function formatKpiValue(kpi, v){
  if (v === null || v === undefined) return "—";
  return kpi.includes("NCC") ? `${v}/10` : `${v}%`;
}

/* Résultat (taux de conformité) d'un item précis pour un indicateur et un mois donnés —
   basé sur l'ensemble des évaluations de cet item (pas seulement les écarts). */
function getItemResult(itemsStats, indicateur, item, moisKey){
  if (!itemsStats || !moisKey) return null;
  const row = itemsStats.find((s) => s.indicateur === indicateur && s.item === item && s.mois === moisKey);
  return row || null;
}
/* Même chose mais agrégée sur un ensemble de mois (utilisé quand le filtre de période sélectionné
   — jour/semaine/plage — touche un ou plusieurs mois) : pondère ok/total sur tous les mois concernés,
   plutôt que de se limiter à un seul mois calendaire. */
function getItemResultForPeriod(itemsStats, indicateur, item, monthKeys){
  if (!itemsStats || !monthKeys || monthKeys.length === 0) return null;
  const rows = itemsStats.filter((s) => s.indicateur === indicateur && s.item === item && monthKeys.includes(s.mois));
  if (rows.length === 0) return null;
  const total = rows.reduce((s,r) => s + (r.total||0), 0);
  const ok = rows.reduce((s,r) => s + (r.ok||0), 0);
  if (total === 0) return null;
  return { taux: Math.round((ok/total)*1000)/10, ok, total };
}

/* Généralise une remarque d'évaluateur (texte libre, souvent très spécifique à un appel/produit) en une
   phrase-cause standardisée et réutilisable — ex : "La CC devait informer le site préparateur concernant
   les brocolis pourri" -> "Le conseiller n'a pas informé le bon interlocuteur d'un problème de qualité/état
   du produit." Classification par familles de mots-clés ; retourne null si aucune famille ne matche
   (l'appelant retombe alors sur un libellé générique par item). */
const REMARQUE_GENERALIZATION_RULES = [
  { motifs: ["informer","information","prevenir","communiquer"], andMotifs: ["perime","pourri","abime","casse","defectueux","avarie","qualite"],
    generic: "Le conseiller n'a pas informé le bon interlocuteur d'un problème de qualité/état du produit." },
  { motifs: ["informer","information","prevenir","communiquer"],
    generic: "Le conseiller n'a pas transmis l'information nécessaire au bon interlocuteur." },
  { motifs: ["perime","pourri","abime","casse","defectueux","avarie"],
    generic: "Le conseiller n'a pas correctement traité un problème de qualité/état du produit." },
  { motifs: ["reformul"], generic: "Le conseiller n'a pas reformulé la demande du client." },
  { motifs: ["rembours","avoir","geste commercial","dedommage","compensation"],
    generic: "Le conseiller n'a pas proposé le geste commercial adapté à la situation." },
  { motifs: ["delai","attente","tarder","trop long","rapidemment","rapidement"],
    generic: "Le conseiller n'a pas respecté le délai de traitement attendu." },
  { motifs: ["identification","identifier"], generic: "Le conseiller n'a pas correctement identifié le client." },
  { motifs: ["politesse","courtoisie","accueil","sourire","amabilite"],
    generic: "Le conseiller n'a pas adopté la posture d'accueil/courtoisie attendue." },
  { motifs: ["transfert","transferer","redirection","orienter","rediriger"],
    generic: "Le conseiller n'a pas orienté correctement l'appel/le dossier vers le bon service." },
  { motifs: ["procedure","process","etape"], generic: "Le conseiller n'a pas respecté la procédure attendue." },
  { motifs: ["ecoute","attention","implication","adaptabilite","adapter"],
    generic: "Le conseiller n'a pas fait preuve d'écoute active/adaptabilité suffisante." },
  { motifs: ["questionnement","question"], generic: "Le conseiller n'a pas posé les questions nécessaires pour cerner le besoin client." },
];
function synthesizeRemarque(remarque){
  const text = (remarque||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  for (const r of REMARQUE_GENERALIZATION_RULES) {
    if (!r.motifs.some((m) => text.includes(m))) continue;
    if (r.andMotifs && !r.andMotifs.some((m) => text.includes(m))) continue;
    return r.generic;
  }
  return null;
}

const MOIS_FR = {"01":"Janvier","02":"Février","03":"Mars","04":"Avril","05":"Mai","06":"Juin","07":"Juillet","08":"Août","09":"Septembre","10":"Octobre","11":"Novembre","12":"Décembre"};
/* Clé "AAAA-MM" -> libellé français, dérivé directement de la date (plus fiable que la correspondance semaine -> mois). */
function monthKeyFromDate(dateStr){
  if (!dateStr || dateStr.length < 7) return null;
  return dateStr.slice(0,7);
}
function monthLabelFromKey(key){
  const [y, m] = key.split("-");
  return `${MOIS_FR[m] || m} ${y}`;
}
/* Liste des mois disponibles (clé + libellé), triée chronologiquement, à partir de tous les jeux de données fournis. */
function computeAvailableMonths(...datasets){
  const keys = new Set();
  datasets.forEach((arr) => (arr || []).forEach((item) => {
    const k = monthKeyFromDate(item.date);
    if (k) keys.add(k);
  }));
  return [...keys].sort().map((k) => ({ key: k, label: monthLabelFromKey(k) }));
}
